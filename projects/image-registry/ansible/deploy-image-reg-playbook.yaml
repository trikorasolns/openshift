---
- name: "Deploy OCP Image Registry"
  hosts: "{{ bastion_host | default('localhost')}}"
  gather_facts: true

  pre_tasks:
  - name: "Validate required variables"
    ansible.builtin.assert:
      that:
      - "ocp_image_reg_sc is defined and ocp_image_reg_sc | length > 0"

  - name: "Set variables"
    ansible.builtin.set_fact:
      openshift_client_root_url: "https://mirror.openshift.com/pub/openshift-v4/{{ ocp_release_arch }}/clients/ocp/{{ ocp_version }}"

  tasks:
  - name: "Create Imag Registry project"
    ansible.builtin.command: |
      oc project openshift-image-registry

  - name: "Get release information"
    ansible.builtin.command: |
      oc create -f <(echo '{
        "apiVersion": "v1",
        "kind": "PersistentVolumeClaim",
        "metadata": {
          "name": "image-registry-storage"
        },
        "spec": {
          "storageClassName": "{{ ocp_image_reg_sc }}",
          "accessModes": [ "ReadWriteMany" ],
          "resources": {
            "requests": { "storage": "500Gi"
          }
        }
      }
      }');

  - name: "Change spec.managementState from Removed to Managed"
    ansible.builtin.command: |
      oc -n openshift-image-registry patch configs.imageregistry.operator.openshift.io cluster \
        --type merge -p '{"spec": {"managementState":"Managed"}}'  

  - name: "Set the spec.storate"
    ansible.builtin.command: |
      oc -n openshift-image-registry patch configs.imageregistry.operator.openshift.io cluster \
        --type merge -p '{"spec": {"storage":{"pvc":{"claim":"image-registry-storage"}}}}'


  - name: "Check that the image registry is available"
    ansible.builtin.command: |
      oc get co image-registry -o json
    register: ocp_image_reg_status_res

  - name: "Enable the external route"
    ansible.builtin.command: |
      oc -n openshift-image-registry patch configs.imageregistry.operator.openshift.io/cluster \
        --patch '{"spec":{"defaultRoute":true}}' --type=merge
...
