# Load Balancer
rhosp_lb_public_ports:
- {name: "api", port: 6443, protocol: "TCP"}
- {name: "https", port: 443, protocol: "TCP"}
- {name: "http", port: 80, protocol: "TCP"}
rhosp_lb_internal_ports:
- {name: "internal-machine-config", port: 22623, protocol: "TCP"}
- {name: "internal-api", port: 6443, protocol: "TCP"}
# - {name: "internal-https", port: 443, protocol: "TCP"}
# - {name: "internal-http", port: 80, protocol: "TCP"}

