rhosp_lb_api_public_ports:
- {name: "api", port: 6443, protocol: "TCP"} # Kubernetes API
- {name: "https", port: 443, protocol: "TCP"}
- {name: "http", port: 80, protocol: "TCP"}
- {name: "stats", port: 9000, protocol: "TCP"}
rhosp_lb_api_internal_ports:
- {name: "internal-machine-config", port: 22623, protocol: "TCP"} # Machine Config
- {name: "internal-api", port: 6443, protocol: "TCP"} # Kubernetes API

rhosp_lb_app_ports:
- {name: "app-https", port: 443, protocol: "TCP"}
- {name: "app-http", port: 80, protocol: "TCP"}

# Nodes
ocp_control_plane_count: 3
ocp_compute_node_count: 10

kubernetes_cloud_provider_openstack_version: v1.35.0
kubernetes_csi_csi_driver_nfs_version: v4.13.0

# NFS, CEPHFS
rhosp_manila_share_protcol: NFS