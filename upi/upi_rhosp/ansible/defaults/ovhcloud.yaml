# - {name: "api-server-public", port: 6443, protocol: "TCP"}
# - {name: "https", port: 443, protocol: "TCP"}
# - {name: "http", port: 80, protocol: "TCP"}
# - {name: "stats", port: 9000, protocol: "TCP"}
# rhosp_lb_internal_ports:
# - {name: "api-int", port: 22623, protocol: "TCP"}
# - {name: "api-server-private", port: 6443, protocolducatI$11TCP"}
# ocp_control_plane_count: 3
# ocp_compute_node_count: 3


rhosp_compute_node:
  1:
    flavor: b3-8
  2:
    flavor: b3-8
  3:
    flavor: b3-8
  4:
    flavor: c3-16
  5:
    flavor: c3-16
  6:
    flavor: c3-16
  7:
    flavor: c3-16
