# OVHCloud:
# Storage
rhosp_share_type: standard-1az
# Instances (vCore/RAM)
# b3-8: 2/8
# b3-16: 4/16
# b3-32: 8/32
# b3-64: 16/64
# c3-8: 4/8
# c3-16: 8/16 
# c3-32: 16/32
# c3-64: 32/64
rhosp_flavor_bastion: b3-8
rhosp_flavor_bootstrap: c3-8
rhosp_flavor_master: b3-16
rhosp_flavor_worker: c3-16
# LB Flavor:
# * small
# * medium
# * large
# * xl
rhosp_lb_flavor: medium
